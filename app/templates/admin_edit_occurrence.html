{% extends "base.html" %}
{% block content %}

<div class="admin-dashboard-container">
    <div class="admin-card dark-card">
        <h2 class="section-title">Edit Occurrence</h2>
        <form method="POST" class="admin-form">
            <label>Event</label>
            <select name="event_id" required>
                {% for e in events %}
                    <option value="{{ e.event_id }}" {% if e.event_id == occurrence.event_id %}selected{% endif %}>
                        {{ e.name }}
                    </option>
                {% endfor %}
            </select>
            <label>Date</label>
            <input type="date" name="occur_date" value="{{ occurrence.occur_date }}" required>
            <label>Start Time</label>
            <input type="time" name="start_time" value="{{ occurrence.start_time }}">
            <label>End Time</label>
            <input type="time" name="end_time" value="{{ occurrence.end_time }}">
            <label>Price Per Day (£)</label>
            <input type="number" step="0.01" name="price_per_day" value="{{ occurrence.price_per_day }}" required>
            <button class="btn">Save Changes</button>
            <a href="{{ url_for('admin_bp.dashboard') }}" class="btn danger">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
